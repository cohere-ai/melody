# This file is based on an autogenerated file by maturin v1.9.6
#    maturin generate-ci github --pytest
# It is edited afterwards
name: python CI

on:
  push:
    branches: [main]
  pull_request: {}
  merge_group: {}

permissions:
  contents: read

jobs:
  build-python-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: cohere-melody-dist
          path: |
            dist/cohere_melody-*.tar.gz
            dist/cohere_melody-*.whl

  py-test:
    runs-on: ubuntu-latest
    needs: build-python-dist
    steps:
      - uses: actions/checkout@v4
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: cohere-melody-dist
          path: dist
      - name: pytest
        shell: bash
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          # Install from the local sdist tarball so we don't pick up a stale
          # prebuilt wheel from PyPI at the same version.
          pip install dist/cohere_melody-*.tar.gz --force-reinstall
          pip install pytest
          pytest --ignore=tests/templating/jinja/python

  py-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: psf/black@stable

  vllm-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        name: Resolve latest vllm CPU Docker versions
        shell: bash
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade packaging
          versions="$(python .github/latest_vllm_versions.py)"
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"

  py-check:
    runs-on: ubuntu-latest
    needs: [build-python-dist, vllm-versions]
    strategy:
      matrix:
        vllm-version: ${{ fromJson(needs.vllm-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - id: vllm-tests
        name: Download vllm parser tests
        shell: bash
        run: |
          set -e
          test_file_output="$(python3 .github/download_vllm_test_files.py "${{ matrix.vllm-version }}")"
          if [[ -z "${test_file_output}" ]]; then
            echo "No vLLM parser test files found; skipping"
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "has_tests=true"
            echo "files<<EOF"
            echo "${test_file_output}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Download Python distributions
        if: steps.vllm-tests.outputs.has_tests == 'true'
        uses: actions/download-artifact@v4
        with:
          name: cohere-melody-dist
          path: dist
      - name: Test vllm parser integration (vllm==${{ matrix.vllm-version }})
        if: steps.vllm-tests.outputs.has_tests == 'true'
        shell: bash
        run: |
          set -e
          mapfile -t test_files <<< "${{ steps.vllm-tests.outputs.files }}"
          image="vllm/vllm-openai-cpu:v${{ matrix.vllm-version }}"
          docker pull "${image}"
          docker run --rm \
            --entrypoint /bin/bash \
            -v "$PWD:/workspace" \
            -w /workspace \
            "${image}" \
            -lc 'set -e; python3 -m pip install pytest; python3 -m pip install dist/cohere_melody-*.whl --force-reinstall; python3 -m pytest "$@"' \
            bash "${test_files[@]}"
