# This file is based on an autogenerated file by maturin v1.9.6
#    maturin generate-ci github --pytest
# It is edited afterwards
name: python CI

on:
  push:
    branches: [main]
  pull_request: {}
  merge_group: {}

permissions:
  contents: read

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: cohere-melody-sdist
          path: dist/cohere_melody-*.tar.gz

  py-test:
    runs-on: ubuntu-latest
    needs: build-sdist
    steps:
      - uses: actions/checkout@v4
      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: cohere-melody-sdist
          path: dist
      - name: pytest
        shell: bash
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          # Install from the local sdist tarball so we don't pick up a stale
          # prebuilt wheel from PyPI at the same version.
          pip install dist/cohere_melody-*.tar.gz --force-reinstall
          pip install pytest
          pytest --ignore=tests/templating/jinja/python

  py-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: psf/black@stable

  vllm-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        name: Resolve latest vllm versions
        shell: bash
        run: |
          set -e
          python3 -m pip install --upgrade packaging
          versions="$(python3 .github/latest_vllm_versions.py)"
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"

  py-check:
    runs-on: ubuntu-latest
    needs: [build-sdist, vllm-versions]
    strategy:
      matrix:
        vllm-version: ${{ fromJson(needs.vllm-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-vllm-${{ matrix.vllm-version }}-${{ hashFiles('pyproject.toml', 'cohere_melody.pyi') }}
          restore-keys: |
            ${{ runner.os }}-pip-vllm-${{ matrix.vllm-version }}-
            ${{ runner.os }}-pip-
      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: cohere-melody-sdist
          path: dist
      - name: Check vllm parser integration (vllm==${{ matrix.vllm-version }})
        shell: bash
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          pip install ty
          pip install \
            "https://github.com/vllm-project/vllm/releases/download/v${{ matrix.vllm-version }}/vllm-${{ matrix.vllm-version }}%2Bcpu-cp38-abi3-manylinux_2_34_x86_64.whl" \
            --extra-index-url https://download.pytorch.org/whl/cpu
          pip install dist/cohere_melody-*.tar.gz --force-reinstall
          mapfile -t parser_files < <(python3 <<'PY'
          import sys
          from importlib import metadata

          required_files = [
              "vllm/reasoning/cohere_command_reasoning_parser.py",
              "vllm/tool_parsers/cohere_command_tool_parser.py",
          ]
          distribution = metadata.distribution("vllm")
          vllm_files = {
              str(path): distribution.locate_file(path)
              for path in distribution.files or []
          }
          missing = [path for path in required_files if path not in vllm_files]
          if missing:
              raise SystemExit(
                  f"vllm {metadata.version('vllm')} is missing upstream Cohere parser files: {missing}"
              )
          print(
              f"cohere_melody {metadata.version('cohere_melody')} is installed "
              f"with vllm {metadata.version('vllm')}",
              file=sys.stderr,
          )
          for path in required_files:
              print(vllm_files[path])
          PY
          )
          ty check cohere_melody.pyi "${parser_files[@]}"
