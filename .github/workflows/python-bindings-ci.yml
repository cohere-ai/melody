# This file is based on an autogenerated file by maturin v1.9.6
#    maturin generate-ci github --pytest
# It is edited afterwards
name: python CI

on:
  push:
    branches: [main]
  pull_request: {}
  merge_group: {}

permissions:
  contents: read

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: cohere-melody-sdist
          path: dist/cohere_melody-*.tar.gz

  py-test:
    runs-on: ubuntu-latest
    needs: build-sdist
    steps:
      - uses: actions/checkout@v4
      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: cohere-melody-sdist
          path: dist
      - name: pytest
        shell: bash
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          # Install from the local sdist tarball so we don't pick up a stale
          # prebuilt wheel from PyPI at the same version.
          pip install dist/cohere_melody-*.tar.gz --force-reinstall
          pip install pytest
          pytest --ignore=tests/templating/jinja/python

  py-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: psf/black@stable

  vllm-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        name: Resolve latest vllm versions
        shell: bash
        run: |
          set -e
          python3 -m pip install --upgrade packaging
          versions="$(python3 .github/latest_vllm_versions.py)"
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"

  py-check:
    runs-on: ubuntu-latest
    needs: [build-sdist, vllm-versions]
    strategy:
      matrix:
        vllm-version: ${{ fromJson(needs.vllm-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: cohere-melody-sdist
          path: dist
      - name: Test vllm parser integration (vllm==${{ matrix.vllm-version }})
        shell: bash
        run: |
          set -e
          test_files=()
          while IFS= read -r test_file; do
            test_files+=("${test_file}")
          done < <(python3 .github/download_vllm_test_files.py "${{ matrix.vllm-version }}")
          if [[ "${#test_files[@]}" -eq 0 ]]; then
            exit 0
          fi
          image="vllm/vllm-openai-cpu:v${{ matrix.vllm-version }}-x86_64"
          docker pull "${image}"
          docker run --rm \
            --entrypoint /bin/bash \
            -v "$PWD:/workspace" \
            -w /workspace \
            "${image}" \
            -lc 'set -e; python3 -m pip install pytest; python3 -m pip install dist/cohere_melody-*.tar.gz --force-reinstall; python3 -m pytest "$@"' \
            bash "${test_files[@]}"
