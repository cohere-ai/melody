# This file is based on an autogenerated file by maturin v1.9.6
#    maturin generate-ci github --pytest
# It is edited afterwards
name: python CI

on:
  push:
    branches: [main]
  pull_request: {}
  merge_group: {}

permissions:
  contents: read

jobs:
  py-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: pytest
        shell: bash
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          # Install from the local sdist tarball so we don't pick up a stale
          # prebuilt wheel from PyPI at the same version.
          pip install dist/cohere_melody-*.tar.gz --force-reinstall
          pip install pytest
          pytest --ignore=tests/templating/jinja/python

  py-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: psf/black@stable

  vllm-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        name: Resolve latest vllm versions
        shell: bash
        run: |
          set -e
          python3 -m pip install --upgrade packaging
          versions="$(python3 .github/latest_vllm_versions.py)"
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"

  py-check:
    runs-on: ubuntu-latest
    needs: vllm-versions
    strategy:
      matrix:
        vllm-version: ${{ fromJson(needs.vllm-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Check vllm parser integration (vllm==${{ matrix.vllm-version }})
        shell: bash
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --no-cache-dir ty pytest
          # Install the vLLM wheel without its full CUDA dependency tree (~10+ GB on CI).
          pip install --no-cache-dir vllm==${{ matrix.vllm-version }} --no-deps
          pip install --no-cache-dir dist/cohere_melody-*.tar.gz --force-reinstall
          python3 <<'PY'
          from importlib import metadata

          required_files = [
              "vllm/reasoning/cohere_command_reasoning_parser.py",
              "vllm/tool_parsers/cohere_command_tool_parser.py",
          ]
          vllm_files = {str(path) for path in metadata.files("vllm") or []}
          missing = [path for path in required_files if path not in vllm_files]
          if missing:
              raise SystemExit(
                  f"vllm {metadata.version('vllm')} is missing upstream Cohere parser files: {missing}"
              )
          print(
              f"cohere_melody {metadata.version('cohere_melody')} is installed "
              f"with vllm {metadata.version('vllm')}"
          )
          PY
          ty check cohere_melody.pyi tests/python/
