# Example configuration demonstrating various template types

# Simple inline template
simple_template: "This is a simple inline template"

# Template from a file
file_template:
  path: example_template.tmpl

# Template with variables
template_with_variables:
  path: example_template.tmpl
  variables:
    greeting:
      path: example_variable.tmpl
    farewell: "Goodbye and see you soon!"

# Template with keep_trailing_newline
template_with_newline:
  path: example_template.tmpl
  keep_trailing_newline: true

