[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "cohere_melody"
description = "Templating rendering and generation parsing for Cohere models"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["cohere", "llm", "templating", "parsing"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/cohere-ai/melody"

[tool.maturin]
features = ["pyo3/extension-module", "python_ffi"]
module-name = "cohere_melody"
include=["cohere_melody_vllm/parser.py"]

[tool.uv]
managed = false

[tool.pytest.ini_options]
# Only collect tests from the top-level tests directory
testpaths = ["tests"]