[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "cohere_melody"
readme = "README.md"
description = "Templating rendering and generation parsing for Cohere models"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["cohere", "llm", "templating", "parsing"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/cohere-ai/melody"
Repository = "https://github.com/cohere-ai/melody"
Issues = "https://github.com/cohere-ai/melody/issues"

[tool.maturin]
features = ["pyo3/extension-module", "python_ffi"]
module-name = "cohere_melody"
include=["cohere_melody.pyi", "cohere_melody_vllm/parser.py"]

[tool.uv]
managed = false

[tool.pytest.ini_options]
# Only collect tests from the top-level tests directory
testpaths = ["tests"]

[tool.ty.analysis]
# vllm/cohere_melody may be absent locally; CI installs both before `ty check`.
# Configuring this avoids per-import `# ty: ignore` comments that become unused
# (and fail CI) once those packages are present.
allowed-unresolved-imports = [
    "vllm.entrypoints.openai.**",
    "cohere_melody",
]